<!DOCTYPE html>
<html lang="en" data-theme="lightBlue">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Noote — Your daily assistant</title>
<meta name="author" content="KARANGWA Cedrique" />  
<meta name="description" content="Noote helps businesses assign tasks or work to workers, manage their notes, reminders and many more all in one app." />
<meta property="og:title" content="Noote - Task Management For Teams." />
<meta property="og:description" content="Assign tasks, track visits, and manage your team - builtfor organisations." /> 
<meta property="og:url" content="https://noote-lime.vercel.app" />  
<meta property="og:type" content="webapp" /> 
<meta property="og:image" content="https://noote-lime.vercel.app/icons/icon-512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Noote - Task Management For Teams" /> 
<meta name="twitter:description" content="Assign tasks, track visits, manage your notes and reminders" />  
<meta name="theme-color" content="#1C6FA6" />
<link rel="canonical" href="https://note-lime.vercel.app" />  
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Noote" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="offline-banner" class="offline-banner hidden">You're offline — changes are saved on this device and the assistant will resume once you're back online.</div>
<div id="verify-banner" class="verify-banner hidden">
  <span>Please verify your email address.</span>
  <button id="resendVerifyBtn">Resend link</button>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <span class="brand-name">noote</span>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-btn active" data-view="today">Today</button>
      <button class="nav-btn" data-view="notes">Notes</button>
      <button class="nav-btn" data-view="tasks">Tasks</button>
      <button class="nav-btn" data-view="calendar">Calendar</button>
      <button class="nav-btn hidden" id="teamNavBtn" data-view="team">Team</button>
      <button class="nav-btn hidden" id="activityNavBtn" data-view="activity">Activity</button>
      <button class="nav-btn" data-view="help">Help</button>
      <button class="nav-btn" data-view="settings">Settings</button>
    </nav>

    <div class="sidebar-bottom">
      <div id="userBadge" class="user-badge"></div>
      <button id="installBtn" class="install-btn hidden">Install Noote</button>
      <button id="themeToggle" class="theme-toggle-btn">Theme</button>
      <div id="themeSwatches" class="theme-swatches hidden"></div>
      <button id="logoutBtn" class="theme-toggle-btn">Log out</button>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- Views are rendered here by app.js -->
  </main>
</div>

<div id="authScreen" class="auth-screen hidden"></div>

<button id="assistantBubble" class="assistant-bubble" title="Ask Noote">✦</button>
<div id="assistantPanel" class="assistant-panel hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
